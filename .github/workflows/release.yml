# Builds gobuildcache's binaries the way gitlab-runner's CI builds them, so
# their SHA-256s are the ones it pins (see scripts/gobuildcache in
# gitlab-org/gitlab-runner): with the official toolchain from the
# golang.org/toolchain module, by go install of the module version from the
# module proxy, with CGO_ENABLED=0, -trimpath and -ldflags="-s -w", in an
# empty directory, with empty caches and none of the runner's Go settings.
# Builds are reproducible, so anyone can check a release's checksums by
# building it the same way, without trusting this workflow.
#
# A tag publishes a release with the binaries and SHA256SUMS. A push that
# changes this file only builds its commit, and reports the checksums as
# notices.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    # not evaluated for tags
    paths: [".github/workflows/release.yml"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # Changing it changes the checksums: gitlab-runner pins it with them.
      TOOLCHAIN: go1.26.5
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - name: Build
        run: |
          set -eu
          work=$(mktemp -d)
          dist=$RUNNER_TEMP/dist
          mkdir -p "$dist"
          cd "$work"

          # The runner image's go only downloads the toolchain module. Both
          # go commands run in the empty directory, so no go.mod or go.work
          # applies. The module's zip doesn't keep execute bits, so they're
          # set the way the go command sets them when it switches toolchains.
          clean=(env -u GOBIN GOPATH="$work" GOCACHE="$work/cache" GOMODCACHE="$work/mod"
            GOFLAGS=-modcacherw GOENV=off GOTOOLCHAIN=local GOCACHEPROG=)
          goroot=$("${clean[@]}" go mod download -json "golang.org/toolchain@v0.0.1-$TOOLCHAIN.linux-amd64" | jq -r .Dir)
          chmod -R u+x "$goroot/pkg/tool" "$goroot/bin"

          for target in linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/}
            exe=$([ "$os" = windows ] && echo .exe || true)
            "${clean[@]}" GOROOT="$goroot" GOOS="$os" GOARCH="$arch" \
              GOAMD64= GOARM64= GOARM= GOEXPERIMENT= GOFIPS140= CGO_ENABLED=0 \
              "$goroot/bin/go" install -trimpath -ldflags="-s -w" "github.com/saracen/gobuildcache@$VERSION"

            # go install puts cross-compiled binaries in a directory per platform
            built=$work/bin/gobuildcache$exe
            [ -e "$built" ] || built=$work/bin/${os}_${arch}/gobuildcache$exe
            mv "$built" "$dist/gobuildcache-$os-$arch$exe"
          done

          cd "$dist"
          sha256sum gobuildcache-* > SHA256SUMS
          while read -r sum name; do
            echo "::notice title=$name::$sum"
          done < SHA256SUMS

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$VERSION" \
            --notes "Built with $TOOLCHAIN by go install of github.com/saracen/gobuildcache@$VERSION, with CGO_ENABLED=0, -trimpath and -ldflags=\"-s -w\". The build is reproducible: SHA256SUMS has the checksums of the binaries." \
            "$RUNNER_TEMP"/dist/*
